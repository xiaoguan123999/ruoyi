server {
    listen 80;
    listen 443 ssl http2;
    server_name api.rgoslz.com;
    # SSL cert paths: let BaoTa fill these after applying a certificate.
    # ssl_certificate     /www/server/panel/vhost/cert/api.rgoslz.com/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/api.rgoslz.com/privkey.pem;

    client_max_body_size 60m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Optional: admin still using /prod-api prefix
    location /prod-api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
